name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build
        working-directory: contracts
      - name: forge lint (src; fails on any non-excluded finding)
        working-directory: contracts
        run: |
          out=$(forge lint src 2>&1); echo "$out"
          if echo "$out" | grep -qE '^(error|warning|note)\['; then exit 1; fi
      - run: forge test
        working-directory: contracts

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:keeper
