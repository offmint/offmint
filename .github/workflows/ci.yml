name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - name: forge build --sizes (fails if any contract exceeds EIP-170)
        run: forge build --sizes
        working-directory: contracts
      - name: forge lint (src; fails on any non-excluded finding)
        working-directory: contracts
        run: |
          out=$(forge lint src 2>&1); echo "$out"
          if echo "$out" | grep -qE '^(error|warning|note)\['; then exit 1; fi
      - run: forge test
        working-directory: contracts
      - name: keeper ABI matches contracts
        run: node scripts/export-abi.mjs && git diff --exit-code keeper/src/abi

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:keeper

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: local anvil weekend (deploy -> arm -> squeeze -> lock -> settle)
        run: scripts/e2e-local.sh
      - name: stress (10 random weekends, 8 depositors, invariants after every step)
        run: npm run stress -w keeper -- --epochs 10 --users 8 --seed 11 --port 8549
