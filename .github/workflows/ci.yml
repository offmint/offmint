name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - name: forge build --sizes (fails if any contract exceeds EIP-170)
        run: forge build --sizes
        working-directory: contracts
      - name: forge lint (src; fails on any non-excluded finding)
        working-directory: contracts
        run: |
          out=$(forge lint src 2>&1); echo "$out"
          if echo "$out" | grep -qE '^(error|warning|note)\['; then exit 1; fi
      - name: "forge test (+ published test count must match web/public/data/tests.json)"
        working-directory: contracts
        run: |
          out=$(forge test 2>&1); echo "$out" | tail -3
          n=$(echo "$out" | grep -oE '[0-9]+ tests passed' | tail -1 | grep -oE '^[0-9]+')
          want=$(python3 -c "import json;print(json.load(open('../web/public/data/tests.json'))['contracts'])")
          [ "$n" = "$want" ] || { echo "tests.json says $want contract tests, forge ran $n"; exit 1; }
      - name: keeper ABI matches contracts
        run: node scripts/export-abi.mjs && git diff --exit-code keeper/src/abi web/src/abi web/src/config

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:keeper

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: local anvil weekend (deploy -> arm -> squeeze -> lock -> settle)
        run: scripts/e2e-local.sh
      - name: MetaVault weekly cycle (buy-in -> commit -> arm -> lock -> settle -> unwind, by the keeper bot)
        run: scripts/e2e-meta.sh
      - name: stress (10 random weekends, 8 depositors, invariants after every step)
        run: npm run stress -w keeper -- --epochs 10 --users 8 --seed 11 --port 8549

  web:
    name: web (Next.js typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # claims: rendered numbers == data files; live-premium quality gate
      - run: npm run build
