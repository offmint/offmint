[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./config" }, { access = "write", path = "../web/src/config" }, { access = "write", path = "./test/vectors" }]

[fuzz]
runs = 1000

[rpc_endpoints]
rh_mainnet = "${ALCHEMY_RH_MAINNET_URL}"
rh_testnet = "${ALCHEMY_RH_TESTNET_URL}"

[lint]
lint_on_build = false

[invariant]
runs = 64
depth = 40
fail_on_revert = false
show_metrics = true
