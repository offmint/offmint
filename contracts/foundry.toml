[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1 # smallest bytecode: keeps OffmintVault under EIP-170 (weekly-cadence calls, gas is secondary)
via_ir = false
fs_permissions = [{ access = "read-write", path = "./config" }, { access = "write", path = "../web/src/config" }, { access = "write", path = "./test/vectors" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[rpc_endpoints]
rh_mainnet = "${ALCHEMY_RH_MAINNET_URL}"
rh_testnet = "${ALCHEMY_RH_TESTNET_URL}"

[lint]
lint_on_build = false
# Reviewed and intentionally excluded (CI runs `forge lint src` and fails on anything else):
#  block-timestamp          - timestamps ARE the time model (never block.number on this Orbit chain)
#  divide-before-multiply   - floor/ceil tick snapping in RangeMath is deliberate integer division
#  unsafe-typecast          - every cast is bound-checked (TickMath range, uint64 timestamps, signed deltas checked)
#  unused-return            - ignored slot0 fields / feesAccrued (already inside callerDelta) / settle() paid amount
#  reentrancy-no-eth/events - every mutator is nonReentrant; unlockCallback is PoolManager-only; tokens have no hooks
#  require-revert-in-loop   - price guards (zero / out-of-range sqrtPrice) run per ladder rung; a bad price must abort
#                             the whole arm rather than silently skip a rung
#  calls-loop               - the rung loop makes <= 4 PoolManager calls (MAX_RUNGS), bounded and intended
#  missing-events-access-control - epoch writes all emit Armed / RungArmed / RungRemoved (false positive)
exclude_lints = ["calls-loop", "missing-events-access-control", "block-timestamp", "divide-before-multiply", "unsafe-typecast", "unused-return", "reentrancy-no-eth", "reentrancy-events", "require-revert-in-loop"]
ignore = ["test/**/*", "script/**/*"]

[invariant]
runs = 64
depth = 40
fail_on_revert = false
show_metrics = true
